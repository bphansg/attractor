<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2880" width="3840" height="2880" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="3840" height="2880" rx="48" fill="url(#bg3)"/>

  <text x="1920" y="170" text-anchor="middle" fill="#f1f5f9" font-size="88" font-weight="700">Pipeline Execution Flow</text>
  <text x="1920" y="270" text-anchor="middle" fill="#94a3b8" font-size="52">Example: Code review pipeline with branching, human gates, and retries</text>

  <!-- DOT source panel -->
  <g>
    <rect x="100" y="360" width="1360" height="1160" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="100" y="360" width="1360" height="120" rx="40" fill="#0f172a"/>
    <rect x="100" y="440" width="1360" height="40" fill="#0f172a"/>
    <circle cx="180" cy="420" r="20" fill="#ef4444" opacity="0.7"/>
    <circle cx="244" cy="420" r="20" fill="#f59e0b" opacity="0.7"/>
    <circle cx="308" cy="420" r="20" fill="#10b981" opacity="0.7"/>
    <text x="780" y="430" text-anchor="middle" fill="#64748b" font-size="40">pipeline.dot</text>

    <text x="180" y="560" fill="#c084fc" font-size="44" font-weight="600">digraph</text>
    <text x="400" y="560" fill="#f8fafc" font-size="44">review_pipeline {</text>
    <text x="220" y="640" fill="#94a3b8" font-size="44">goal = </text>
    <text x="400" y="640" fill="#86efac" font-size="44">"Review and ship code"</text>
    <text x="220" y="730" fill="#94a3b8" font-size="40">start    [shape=Mdiamond]</text>
    <text x="220" y="800" fill="#94a3b8" font-size="40">analyze  [prompt="Analyze code"]</text>
    <text x="220" y="870" fill="#94a3b8" font-size="40">test     [prompt="Run tests"]</text>
    <text x="220" y="940" fill="#94a3b8" font-size="40">gate     [shape=diamond]</text>
    <text x="220" y="1010" fill="#94a3b8" font-size="40">review   [shape=hexagon]</text>
    <text x="220" y="1080" fill="#94a3b8" font-size="40">fix      [prompt="Fix issues"]</text>
    <text x="220" y="1150" fill="#94a3b8" font-size="40">ship     [prompt="Deploy"]</text>
    <text x="220" y="1220" fill="#94a3b8" font-size="40">done     [shape=Msquare]</text>

    <text x="220" y="1310" fill="#64748b" font-size="40">start &#8594; analyze &#8594; test &#8594; gate</text>
    <text x="220" y="1380" fill="#10b981" font-size="40">gate &#8594; review [condition="..."]</text>
    <text x="220" y="1450" fill="#ef4444" font-size="40">gate &#8594; fix [condition="..."]</text>
    <text x="180" y="1500" fill="#f8fafc" font-size="44">}</text>
  </g>

  <!-- Flow diagram -->
  <!-- Start node -->
  <g>
    <polygon points="1920,440 2020,520 1920,600 1820,520" fill="#6366f1" stroke="#818cf8" stroke-width="6"/>
    <text x="1920" y="535" text-anchor="middle" fill="#fff" font-size="40" font-weight="600">start</text>
  </g>

  <line x1="1920" y1="600" x2="1920" y2="700" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr2)"/>

  <!-- Analyze node -->
  <g>
    <rect x="1700" y="720" width="440" height="176" rx="32" fill="#3b82f6"/>
    <text x="1920" y="800" text-anchor="middle" fill="#fff" font-size="44" font-weight="600">analyze</text>
    <text x="1920" y="860" text-anchor="middle" fill="#bfdbfe" font-size="36">LLM task</text>
  </g>

  <line x1="1920" y1="896" x2="1920" y2="996" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr2)"/>

  <!-- Test node -->
  <g>
    <rect x="1700" y="1016" width="440" height="176" rx="32" fill="#3b82f6"/>
    <text x="1920" y="1096" text-anchor="middle" fill="#fff" font-size="44" font-weight="600">test</text>
    <text x="1920" y="1156" text-anchor="middle" fill="#bfdbfe" font-size="36">LLM task</text>
  </g>

  <line x1="1920" y1="1192" x2="1920" y2="1296" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr2)"/>

  <!-- Gate (diamond) -->
  <g>
    <polygon points="1920,1320 2120,1440 1920,1560 1720,1440" fill="#14b8a6" stroke="#2dd4bf" stroke-width="6"/>
    <text x="1920" y="1455" text-anchor="middle" fill="#fff" font-size="40" font-weight="600">gate</text>
  </g>

  <!-- Success path (right) -->
  <line x1="2120" y1="1440" x2="2400" y2="1440" stroke="#10b981" stroke-width="8" marker-end="url(#arr-green)"/>
  <text x="2260" y="1410" text-anchor="middle" fill="#10b981" font-size="40" font-weight="600">pass</text>

  <!-- Review node (hexagon) -->
  <g>
    <polygon points="2560,1360 2720,1360 2800,1440 2720,1520 2560,1520 2480,1440" fill="#f59e0b" stroke="#fbbf24" stroke-width="6"/>
    <text x="2640" y="1455" text-anchor="middle" fill="#fff" font-size="40" font-weight="600">review</text>
  </g>

  <!-- Human gate indicator -->
  <g>
    <rect x="2840" y="1360" width="340" height="88" rx="44" fill="#78350f" opacity="0.4" stroke="#f59e0b" stroke-width="4"/>
    <text x="3010" y="1415" text-anchor="middle" fill="#fbbf24" font-size="36">human gate</text>
  </g>

  <!-- Approved path down -->
  <line x1="2640" y1="1520" x2="2640" y2="1720" stroke="#10b981" stroke-width="8" marker-end="url(#arr-green)"/>
  <text x="2720" y="1640" fill="#10b981" font-size="40">approved</text>

  <!-- Ship node -->
  <g>
    <rect x="2420" y="1740" width="440" height="176" rx="32" fill="#3b82f6"/>
    <text x="2640" y="1820" text-anchor="middle" fill="#fff" font-size="44" font-weight="600">ship</text>
    <text x="2640" y="1880" text-anchor="middle" fill="#bfdbfe" font-size="36">deploy</text>
  </g>

  <line x1="2640" y1="1916" x2="2640" y2="2040" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr2)"/>

  <!-- Done node -->
  <g>
    <rect x="2540" y="2060" width="200" height="144" rx="16" fill="#6366f1" stroke="#818cf8" stroke-width="8"/>
    <text x="2640" y="2148" text-anchor="middle" fill="#fff" font-size="40" font-weight="600">done</text>
  </g>

  <!-- Fail path (down from gate) -->
  <line x1="1920" y1="1560" x2="1920" y2="1740" stroke="#ef4444" stroke-width="8" marker-end="url(#arr-red)"/>
  <text x="2000" y="1670" fill="#ef4444" font-size="40" font-weight="600">fail</text>

  <!-- Fix node -->
  <g>
    <rect x="1700" y="1760" width="440" height="176" rx="32" fill="#ef4444" opacity="0.9"/>
    <text x="1920" y="1840" text-anchor="middle" fill="#fff" font-size="44" font-weight="600">fix</text>
    <text x="1920" y="1900" text-anchor="middle" fill="#fee2e2" font-size="36">fix issues</text>
  </g>

  <!-- Loop back from fix to test -->
  <path d="M 1700 1848 L 1560 1848 Q 1500 1848 1500 1788 L 1500 1104 Q 1500 1044 1560 1044 L 1690 1044" stroke="#f59e0b" stroke-width="6" fill="none" stroke-dasharray="20,12" marker-end="url(#arr-yellow)"/>
  <text x="1440" y="1440" fill="#fbbf24" font-size="36" text-anchor="end" transform="rotate(-90 1440 1440)">retry loop</text>

  <!-- Changes requested path from review to fix -->
  <path d="M 2560 1520 L 2360 1600 Q 2300 1630 2240 1600 L 2100 1848 L 2150 1848" stroke="#ef4444" stroke-width="6" fill="none" marker-end="url(#arr-red)"/>
  <text x="2240" y="1610" fill="#fca5a5" font-size="36">changes requested</text>

  <!-- Legend -->
  <g transform="translate(100, 1720)">
    <rect width="1300" height="1080" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <text x="650" y="100" text-anchor="middle" fill="#f1f5f9" font-size="52" font-weight="700">Legend</text>

    <polygon points="160,200 220,250 160,300 100,250" fill="#6366f1" stroke="#818cf8" stroke-width="4"/>
    <text x="280" y="262" fill="#e2e8f0" font-size="44">Start / Entry point</text>

    <rect x="100" y="340" width="120" height="80" rx="16" fill="#3b82f6"/>
    <text x="280" y="392" fill="#e2e8f0" font-size="44">LLM Task (codergen)</text>

    <polygon points="160,470 220,520 160,570 100,520" fill="#14b8a6" stroke="#2dd4bf" stroke-width="4"/>
    <text x="280" y="532" fill="#e2e8f0" font-size="44">Conditional Branch</text>

    <polygon points="180,610 240,610 280,650 240,690 180,690 140,650" fill="#f59e0b" stroke="#fbbf24" stroke-width="4"/>
    <text x="340" y="662" fill="#e2e8f0" font-size="44">Human Gate</text>

    <rect x="100" y="730" width="120" height="80" rx="16" fill="#6366f1" stroke="#818cf8" stroke-width="8"/>
    <text x="280" y="782" fill="#e2e8f0" font-size="44">Exit / Done</text>

    <line x1="100" y1="870" x2="220" y2="870" stroke="#10b981" stroke-width="8"/>
    <text x="280" y="882" fill="#10b981" font-size="44">Success path</text>

    <line x1="100" y1="950" x2="220" y2="950" stroke="#ef4444" stroke-width="8"/>
    <text x="280" y="962" fill="#ef4444" font-size="44">Failure / retry path</text>

    <line x1="100" y1="1030" x2="220" y2="1030" stroke="#f59e0b" stroke-width="6" stroke-dasharray="20,12"/>
    <text x="280" y="1042" fill="#fbbf24" font-size="44">Retry loop</text>
  </g>

  <!-- Annotations -->
  <g>
    <rect x="2960" y="440" width="720" height="340" rx="32" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <text x="3320" y="520" text-anchor="middle" fill="#94a3b8" font-size="40" font-weight="600">Execution Order</text>
    <text x="3040" y="600" fill="#64748b" font-size="40">1. Parse .dot file</text>
    <text x="3040" y="670" fill="#64748b" font-size="40">2. Build + validate graph</text>
    <text x="3040" y="740" fill="#64748b" font-size="40">3. Walk nodes top-down</text>
  </g>

  <g>
    <rect x="2960" y="820" width="720" height="400" rx="32" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <text x="3320" y="900" text-anchor="middle" fill="#94a3b8" font-size="40" font-weight="600">Edge Selection</text>
    <text x="3040" y="980" fill="#64748b" font-size="36">1. Evaluate conditions</text>
    <text x="3040" y="1045" fill="#64748b" font-size="36">2. Check preferred_label</text>
    <text x="3040" y="1110" fill="#64748b" font-size="36">3. Use weight priority</text>
    <text x="3040" y="1175" fill="#64748b" font-size="36">4. Fallback to first edge</text>
  </g>
</svg>

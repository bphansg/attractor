<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="sh3" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="700" rx="16" fill="url(#bg3)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Pipeline Execution Flow</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Example: Code review pipeline with branching, human gates, and retries</text>

  <!-- DOT source panel -->
  <g filter="url(#sh3)">
    <rect x="30" y="90" width="320" height="280" rx="10" fill="rgba(30,41,59,0.95)" stroke="#334155" stroke-width="1"/>
    <rect x="30" y="90" width="320" height="30" rx="10" fill="#1e293b"/>
    <rect x="30" y="108" width="320" height="12" fill="#1e293b"/>
    <circle cx="50" cy="105" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="66" cy="105" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="82" cy="105" r="5" fill="#10b981" opacity="0.7"/>
    <text x="190" y="109" text-anchor="middle" fill="#64748b" font-size="10">pipeline.dot</text>

    <text x="50" y="142" fill="#c084fc" font-size="11" font-weight="600">digraph</text>
    <text x="105" y="142" fill="#f8fafc" font-size="11">review_pipeline {</text>
    <text x="60" y="160" fill="#94a3b8" font-size="11">goal = </text>
    <text x="106" y="160" fill="#86efac" font-size="11">"Review and ship code"</text>
    <text x="60" y="182" fill="#94a3b8" font-size="10">start    [shape=Mdiamond]</text>
    <text x="60" y="198" fill="#94a3b8" font-size="10">analyze  [prompt="Analyze code"]</text>
    <text x="60" y="214" fill="#94a3b8" font-size="10">test     [prompt="Run tests"]</text>
    <text x="60" y="230" fill="#94a3b8" font-size="10">gate     [shape=diamond]</text>
    <text x="60" y="246" fill="#94a3b8" font-size="10">review   [shape=hexagon]</text>
    <text x="60" y="262" fill="#94a3b8" font-size="10">fix      [prompt="Fix issues"]</text>
    <text x="60" y="278" fill="#94a3b8" font-size="10">ship     [prompt="Deploy"]</text>
    <text x="60" y="294" fill="#94a3b8" font-size="10">done     [shape=Msquare]</text>

    <text x="60" y="316" fill="#64748b" font-size="10">start &#8594; analyze &#8594; test &#8594; gate</text>
    <text x="60" y="332" fill="#10b981" font-size="10">gate &#8594; review [condition="..."]</text>
    <text x="60" y="348" fill="#ef4444" font-size="10">gate &#8594; fix [condition="..."]</text>
    <text x="50" y="362" fill="#f8fafc" font-size="11">}</text>
  </g>

  <!-- Flow diagram -->
  <!-- Start node -->
  <g filter="url(#sh3)">
    <polygon points="450,110 475,130 450,150 425,130" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
    <text x="450" y="134" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">start</text>
  </g>

  <line x1="450" y1="150" x2="450" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Analyze node -->
  <g filter="url(#sh3)">
    <rect x="395" y="180" width="110" height="44" rx="8" fill="#3b82f6"/>
    <text x="450" y="200" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">analyze</text>
    <text x="450" y="215" text-anchor="middle" fill="#bfdbfe" font-size="9">LLM task</text>
  </g>

  <line x1="450" y1="224" x2="450" y2="249" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Test node -->
  <g filter="url(#sh3)">
    <rect x="395" y="254" width="110" height="44" rx="8" fill="#3b82f6"/>
    <text x="450" y="274" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">test</text>
    <text x="450" y="289" text-anchor="middle" fill="#bfdbfe" font-size="9">LLM task</text>
  </g>

  <line x1="450" y1="298" x2="450" y2="325" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Gate (diamond) -->
  <g filter="url(#sh3)">
    <polygon points="450,330 500,360 450,390 400,360" fill="#14b8a6" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="450" y="364" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">gate</text>
  </g>

  <!-- Success path (right) -->
  <line x1="500" y1="360" x2="570" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="535" y="352" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">pass</text>

  <!-- Review node (hexagon) -->
  <g filter="url(#sh3)">
    <polygon points="620,340 660,340 680,360 660,380 620,380 600,360" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="640" y="364" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">review</text>
  </g>

  <!-- Human gate indicator -->
  <g>
    <rect x="690" y="340" width="80" height="22" rx="11" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="730" y="355" text-anchor="middle" fill="#fbbf24" font-size="9">human gate</text>
  </g>

  <!-- Approved path down -->
  <line x1="640" y1="380" x2="640" y2="430" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="660" y="410" fill="#10b981" font-size="10">approved</text>

  <!-- Ship node -->
  <g filter="url(#sh3)">
    <rect x="585" y="435" width="110" height="44" rx="8" fill="#3b82f6"/>
    <text x="640" y="455" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">ship</text>
    <text x="640" y="470" text-anchor="middle" fill="#bfdbfe" font-size="9">deploy</text>
  </g>

  <line x1="640" y1="479" x2="640" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Done node -->
  <g filter="url(#sh3)">
    <rect x="615" y="515" width="50" height="36" rx="4" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
    <text x="640" y="537" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">done</text>
  </g>

  <!-- Fail path (down from gate) -->
  <line x1="450" y1="390" x2="450" y2="435" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="470" y="418" fill="#ef4444" font-size="10" font-weight="600">fail</text>

  <!-- Fix node -->
  <g filter="url(#sh3)">
    <rect x="395" y="440" width="110" height="44" rx="8" fill="#ef4444" opacity="0.9"/>
    <text x="450" y="460" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">fix</text>
    <text x="450" y="475" text-anchor="middle" fill="#fee2e2" font-size="9">fix issues</text>
  </g>

  <!-- Loop back from fix to test -->
  <path d="M 395 462 L 370 462 Q 355 462 355 447 L 355 276 Q 355 261 370 261 L 390 261" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-yellow)"/>
  <text x="340" y="370" fill="#fbbf24" font-size="9" text-anchor="end" transform="rotate(-90 340 370)">retry loop</text>

  <!-- Changes requested path from review to fix -->
  <path d="M 620 380 L 570 400 Q 555 408 540 400 L 510 462 L 505 462" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="545" y="405" fill="#fca5a5" font-size="9">changes requested</text>

  <!-- Legend -->
  <g transform="translate(30, 430)">
    <rect width="310" height="260" rx="10" fill="rgba(30,41,59,0.85)" stroke="#334155" stroke-width="1"/>
    <text x="155" y="28" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">Legend</text>

    <polygon points="40,55 55,65 40,75 25,65" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
    <text x="70" y="69" fill="#e2e8f0" font-size="11">Start / Entry point</text>

    <rect x="25" y="85" width="30" height="20" rx="4" fill="#3b82f6"/>
    <text x="70" y="99" fill="#e2e8f0" font-size="11">LLM Task (codergen)</text>

    <polygon points="40,120 55,130 40,140 25,130" fill="#14b8a6" stroke="#2dd4bf" stroke-width="1"/>
    <text x="70" y="134" fill="#e2e8f0" font-size="11">Conditional Branch</text>

    <polygon points="50,155 65,155 75,165 65,175 50,175 40,165" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/>
    <text x="90" y="169" fill="#e2e8f0" font-size="11">Human Gate</text>

    <rect x="25" y="185" width="30" height="20" rx="4" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
    <text x="70" y="199" fill="#e2e8f0" font-size="11">Exit / Done</text>

    <line x1="25" y1="220" x2="55" y2="220" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="224" fill="#10b981" font-size="11">Success path</text>

    <line x1="25" y1="240" x2="55" y2="240" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="244" fill="#ef4444" font-size="11">Failure / retry path</text>

    <line x1="25" y1="260" x2="55" y2="260" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="70" y="264" fill="#fbbf24" font-size="11">Retry loop</text>
  </g>

  <!-- Annotations -->
  <g>
    <rect x="700" y="110" width="170" height="85" rx="8" fill="rgba(30,41,59,0.85)" stroke="#334155" stroke-width="1"/>
    <text x="785" y="132" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Execution Order</text>
    <text x="720" y="152" fill="#64748b" font-size="10">1. Parse .dot file</text>
    <text x="720" y="168" fill="#64748b" font-size="10">2. Build + validate graph</text>
    <text x="720" y="184" fill="#64748b" font-size="10">3. Walk nodes top-down</text>
  </g>

  <g>
    <rect x="700" y="210" width="170" height="100" rx="8" fill="rgba(30,41,59,0.85)" stroke="#334155" stroke-width="1"/>
    <text x="785" y="232" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Edge Selection</text>
    <text x="720" y="250" fill="#64748b" font-size="9">1. Evaluate conditions</text>
    <text x="720" y="265" fill="#64748b" font-size="9">2. Check preferred_label</text>
    <text x="720" y="280" fill="#64748b" font-size="9">3. Use weight priority</text>
    <text x="720" y="295" fill="#64748b" font-size="9">4. Fallback to first edge</text>
  </g>
</svg>

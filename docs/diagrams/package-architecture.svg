<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2880" width="3840" height="2880" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cli-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="engine-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="agent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="llm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2880" rx="48" fill="url(#bg)"/>

  <!-- Title -->
  <text x="1920" y="180" text-anchor="middle" fill="#f1f5f9" font-size="88" font-weight="700" letter-spacing="2">Attractor Package Architecture</text>
  <text x="1920" y="280" text-anchor="middle" fill="#94a3b8" font-size="52">pnpm monorepo with layered dependencies</text>

  <!-- CLI Package -->
  <g>
    <rect x="1020" y="400" width="1800" height="420" rx="48" fill="url(#cli-grad)" opacity="0.95"/>
    <text x="1200" y="530" fill="#fff" font-size="72" font-weight="700">@attractor/cli</text>
    <text x="1200" y="620" fill="#e0e7ff" font-size="48">Command-line interface</text>
    <text x="1200" y="720" fill="#c4b5fd" font-size="44">run | validate | generate | serve | visualize</text>
    <rect x="2420" y="460" width="300" height="110" rx="55" fill="#6d28d9" opacity="0.5"/>
    <text x="2570" y="530" text-anchor="middle" fill="#fff" font-size="44" font-weight="600">CLI</text>
  </g>

  <!-- Arrow CLI -> Engine -->
  <line x1="1920" y1="820" x2="1920" y2="980" stroke="#64748b" stroke-width="8" stroke-dasharray="24,16"/>
  <polygon points="1900,960 1920,1010 1940,960" fill="#64748b"/>

  <!-- Engine Package -->
  <g>
    <rect x="400" y="1020" width="3040" height="580" rx="48" fill="url(#engine-grad)" opacity="0.95"/>
    <text x="600" y="1160" fill="#fff" font-size="72" font-weight="700">@attractor/engine</text>
    <text x="600" y="1250" fill="#bfdbfe" font-size="48">Pipeline engine &#8212; DOT-based workflow orchestration</text>

    <!-- Engine sub-modules -->
    <g>
      <rect x="500" y="1310" width="420" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="710" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">DOT Parser</text>
      <text x="710" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">lexer + AST</text>
    </g>
    <g>
      <rect x="960" y="1310" width="420" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="1170" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">Graph</text>
      <text x="1170" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">builder + model</text>
    </g>
    <g>
      <rect x="1420" y="1310" width="420" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="1630" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">Runner</text>
      <text x="1630" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">execution loop</text>
    </g>
    <g>
      <rect x="1880" y="1310" width="420" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="2090" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">Handlers</text>
      <text x="2090" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">9 node types</text>
    </g>
    <g>
      <rect x="2340" y="1310" width="420" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="2550" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">HTTP Server</text>
      <text x="2550" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">REST + SSE</text>
    </g>
    <g>
      <rect x="2800" y="1310" width="500" height="200" rx="32" fill="#1e40af" opacity="0.4"/>
      <text x="3050" y="1395" text-anchor="middle" fill="#e0f2fe" font-size="40" font-weight="600">Conditions</text>
      <text x="3050" y="1455" text-anchor="middle" fill="#93c5fd" font-size="36">edge routing</text>
    </g>
  </g>

  <!-- Arrow Engine -> Agent -->
  <line x1="1500" y1="1600" x2="1500" y2="1780" stroke="#64748b" stroke-width="8" stroke-dasharray="24,16"/>
  <polygon points="1480,1760 1500,1810 1520,1760" fill="#64748b"/>

  <!-- Arrow Engine -> LLM (direct) -->
  <line x1="2400" y1="1600" x2="2400" y2="2200" stroke="#64748b" stroke-width="8" stroke-dasharray="24,16"/>
  <polygon points="2380,2180 2400,2230 2420,2180" fill="#64748b"/>

  <!-- Agent Package -->
  <g>
    <rect x="400" y="1840" width="1800" height="420" rx="48" fill="url(#agent-grad)" opacity="0.95"/>
    <text x="600" y="1975" fill="#fff" font-size="72" font-weight="700">@attractor/agent</text>
    <text x="600" y="2065" fill="#d1fae5" font-size="48">Coding agent loop with provider-aligned tools</text>
    <text x="600" y="2155" fill="#a7f3d0" font-size="44">session | tools | profiles | env | subagents</text>
  </g>

  <!-- Arrow Agent -> LLM -->
  <line x1="1500" y1="2260" x2="1920" y2="2380" stroke="#64748b" stroke-width="8" stroke-dasharray="24,16"/>
  <polygon points="1900,2370 1940,2395 1910,2350" fill="#64748b"/>

  <!-- LLM Package -->
  <g>
    <rect x="1020" y="2380" width="1800" height="420" rx="48" fill="url(#llm-grad)" opacity="0.95"/>
    <text x="1200" y="2520" fill="#fff" font-size="72" font-weight="700">@attractor/llm</text>
    <text x="1200" y="2610" fill="#fef3c7" font-size="48">Unified multi-provider LLM client</text>
    <text x="1200" y="2700" fill="#fde68a" font-size="44">OpenAI | Anthropic | Gemini | middleware | retry</text>
  </g>

  <!-- Provider icons at bottom -->
  <g transform="translate(1920, 2840)">
    <circle cx="-300" cy="0" r="16" fill="#10b981"/>
    <text x="-270" y="12" fill="#94a3b8" font-size="40">OpenAI</text>
    <circle cx="50" cy="0" r="16" fill="#f59e0b"/>
    <text x="80" y="12" fill="#94a3b8" font-size="40">Anthropic</text>
    <circle cx="400" cy="0" r="16" fill="#3b82f6"/>
    <text x="430" y="12" fill="#94a3b8" font-size="40">Gemini</text>
  </g>
</svg>

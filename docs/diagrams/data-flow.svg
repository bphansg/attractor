<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2400" width="3840" height="2400" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="3840" height="2400" rx="48" fill="url(#bg4)"/>

  <text x="1920" y="170" text-anchor="middle" fill="#f1f5f9" font-size="88" font-weight="700">Data Flow and Integration Points</text>
  <text x="1920" y="270" text-anchor="middle" fill="#94a3b8" font-size="52">How data moves through Attractor from input to output</text>

  <!-- User Input -->
  <g>
    <rect x="100" y="400" width="600" height="240" rx="40" fill="#312e81" opacity="0.5" stroke="#6366f1" stroke-width="6"/>
    <text x="400" y="510" text-anchor="middle" fill="#c4b5fd" font-size="48" font-weight="600">User Input</text>
    <text x="400" y="580" text-anchor="middle" fill="#818cf8" font-size="40">.dot file or NL text</text>
  </g>

  <line x1="700" y1="520" x2="860" y2="520" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>

  <!-- CLI / HTTP -->
  <g>
    <rect x="880" y="360" width="560" height="320" rx="40" fill="#4c1d95" opacity="0.4" stroke="#8b5cf6" stroke-width="6"/>
    <text x="1160" y="475" text-anchor="middle" fill="#c4b5fd" font-size="48" font-weight="600">CLI / HTTP</text>
    <text x="1160" y="545" text-anchor="middle" fill="#a78bfa" font-size="40">parse args</text>
    <text x="1160" y="610" text-anchor="middle" fill="#a78bfa" font-size="40">auth + validate</text>
  </g>

  <!-- Two paths from CLI -->
  <line x1="1440" y1="460" x2="1700" y2="460" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>
  <text x="1570" y="435" text-anchor="middle" fill="#64748b" font-size="36">.dot</text>

  <path d="M 1440 580 L 1570 580 Q 1600 580 1600 630 L 1600 920 L 1700 920" stroke="#94a3b8" stroke-width="6" fill="none" marker-end="url(#arr3)"/>
  <text x="1570" y="650" fill="#64748b" font-size="36">NL text</text>

  <!-- DOT Parser -->
  <g>
    <rect x="1720" y="360" width="560" height="220" rx="40" fill="#1e3a5f" opacity="0.5" stroke="#3b82f6" stroke-width="6"/>
    <text x="2000" y="465" text-anchor="middle" fill="#93c5fd" font-size="48" font-weight="600">DOT Parser</text>
    <text x="2000" y="535" text-anchor="middle" fill="#60a5fa" font-size="40">lexer &#8594; AST</text>
  </g>

  <!-- NL Generator -->
  <g>
    <rect x="1720" y="840" width="560" height="220" rx="40" fill="#78350f" opacity="0.5" stroke="#f59e0b" stroke-width="6"/>
    <text x="2000" y="945" text-anchor="middle" fill="#fcd34d" font-size="48" font-weight="600">NL Generator</text>
    <text x="2000" y="1015" text-anchor="middle" fill="#fbbf24" font-size="40">LLM &#8594; DOT + validate</text>
  </g>

  <!-- Arrow from NL Generator up to Parser -->
  <path d="M 2280 920 L 2400 920 Q 2440 920 2440 860 L 2440 470 L 2290 470" stroke="#f59e0b" stroke-width="6" fill="none" stroke-dasharray="20,12" marker-end="url(#arr3)"/>
  <text x="2500" y="700" fill="#fbbf24" font-size="36" transform="rotate(-90 2500 700)">generated .dot</text>

  <!-- Arrow Parser -> Graph Builder -->
  <line x1="2280" y1="470" x2="2600" y2="470" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>

  <!-- Graph Builder + Validator -->
  <g>
    <rect x="2620" y="360" width="1080" height="220" rx="40" fill="#134e4a" opacity="0.5" stroke="#14b8a6" stroke-width="6"/>
    <text x="3160" y="465" text-anchor="middle" fill="#5eead4" font-size="48" font-weight="600">Graph Builder + Validator</text>
    <text x="3160" y="535" text-anchor="middle" fill="#2dd4bf" font-size="40">AST &#8594; Graph &#8594; 13 lint rules</text>
  </g>

  <!-- Arrow down to Transforms -->
  <line x1="3160" y1="580" x2="3160" y2="720" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>

  <!-- Transforms -->
  <g>
    <rect x="2620" y="740" width="1080" height="200" rx="40" fill="#312e81" opacity="0.3" stroke="#6366f1" stroke-width="4"/>
    <text x="3160" y="835" text-anchor="middle" fill="#a5b4fc" font-size="48" font-weight="600">Transforms</text>
    <text x="3160" y="900" text-anchor="middle" fill="#818cf8" font-size="40">$goal expansion | stylesheet | custom</text>
  </g>

  <!-- Arrow down to Runner -->
  <line x1="3160" y1="940" x2="3160" y2="1080" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>

  <!-- Runner (big box) -->
  <g>
    <rect x="1480" y="1100" width="2220" height="520" rx="48" fill="#78350f" opacity="0.15" stroke="#f59e0b" stroke-width="6"/>
    <text x="2590" y="1195" text-anchor="middle" fill="#fbbf24" font-size="56" font-weight="700">Execution Runner</text>

    <rect x="1540" y="1240" width="440" height="160" rx="24" fill="#1e3a5f" opacity="0.5" stroke="#3b82f6" stroke-width="4"/>
    <text x="1760" y="1335" text-anchor="middle" fill="#93c5fd" font-size="40" font-weight="600">Handler Dispatch</text>

    <rect x="2020" y="1240" width="440" height="160" rx="24" fill="#134e4a" opacity="0.5" stroke="#14b8a6" stroke-width="4"/>
    <text x="2240" y="1335" text-anchor="middle" fill="#5eead4" font-size="40" font-weight="600">Edge Selection</text>

    <rect x="2500" y="1240" width="400" height="160" rx="24" fill="#4c1d95" opacity="0.4" stroke="#8b5cf6" stroke-width="4"/>
    <text x="2700" y="1335" text-anchor="middle" fill="#c4b5fd" font-size="40" font-weight="600">Retry Logic</text>

    <rect x="2940" y="1240" width="360" height="160" rx="24" fill="#831843" opacity="0.4" stroke="#ec4899" stroke-width="4"/>
    <text x="3120" y="1335" text-anchor="middle" fill="#f9a8d4" font-size="40" font-weight="600">Goal Gate</text>

    <rect x="1540" y="1430" width="640" height="130" rx="24" fill="#4c1d95" opacity="0.3" stroke="#8b5cf6" stroke-width="4"/>
    <text x="1860" y="1510" text-anchor="middle" fill="#c4b5fd" font-size="40">Context (KV) + Checkpoint</text>

    <rect x="2220" y="1430" width="500" height="130" rx="24" fill="#7f1d1d" opacity="0.3" stroke="#ef4444" stroke-width="4"/>
    <text x="2470" y="1510" text-anchor="middle" fill="#fca5a5" font-size="40">Event Emitter</text>

    <rect x="2760" y="1430" width="560" height="130" rx="24" fill="#312e81" opacity="0.3" stroke="#6366f1" stroke-width="4"/>
    <text x="3040" y="1510" text-anchor="middle" fill="#a5b4fc" font-size="40">Artifact Store</text>
  </g>

  <!-- External integrations on the left -->
  <g>
    <rect x="100" y="1140" width="700" height="440" rx="40" fill="#064e3b" opacity="0.4" stroke="#10b981" stroke-width="6"/>
    <text x="450" y="1250" text-anchor="middle" fill="#6ee7b7" font-size="48" font-weight="700">LLM Providers</text>
    <rect x="160" y="1290" width="200" height="80" rx="16" fill="#065f46" opacity="0.6"/>
    <text x="260" y="1340" text-anchor="middle" fill="#a7f3d0" font-size="36">OpenAI</text>
    <rect x="380" y="1290" width="280" height="80" rx="16" fill="#065f46" opacity="0.6"/>
    <text x="520" y="1340" text-anchor="middle" fill="#a7f3d0" font-size="36">Anthropic</text>
    <rect x="160" y="1390" width="220" height="80" rx="16" fill="#065f46" opacity="0.6"/>
    <text x="270" y="1440" text-anchor="middle" fill="#a7f3d0" font-size="36">Gemini</text>
    <rect x="400" y="1390" width="260" height="80" rx="16" fill="#065f46" opacity="0.6"/>
    <text x="530" y="1440" text-anchor="middle" fill="#a7f3d0" font-size="36">custom</text>
    <text x="450" y="1540" text-anchor="middle" fill="#6ee7b7" font-size="36">via @attractor/llm</text>
  </g>

  <line x1="800" y1="1360" x2="1470" y2="1360" stroke="#10b981" stroke-width="6" marker-end="url(#arr3)"/>
  <text x="1135" y="1330" text-anchor="middle" fill="#6ee7b7" font-size="36">prompt / response</text>

  <!-- Human / Interviewer -->
  <g>
    <rect x="100" y="1680" width="700" height="260" rx="40" fill="#78350f" opacity="0.4" stroke="#f59e0b" stroke-width="6"/>
    <text x="450" y="1800" text-anchor="middle" fill="#fcd34d" font-size="48" font-weight="700">Human</text>
    <text x="450" y="1870" text-anchor="middle" fill="#fbbf24" font-size="40">console | HTTP | auto</text>
  </g>

  <line x1="800" y1="1810" x2="1470" y2="1560" stroke="#f59e0b" stroke-width="6" marker-end="url(#arr3)"/>
  <text x="1080" y="1715" fill="#fbbf24" font-size="36">question / answer</text>

  <!-- Outputs -->
  <line x1="2590" y1="1620" x2="2590" y2="1780" stroke="#94a3b8" stroke-width="6" marker-end="url(#arr3)"/>

  <g>
    <rect x="1480" y="1800" width="2220" height="240" rx="40" fill="#312e81" opacity="0.2" stroke="#6366f1" stroke-width="4"/>
    <text x="2590" y="1900" text-anchor="middle" fill="#c4b5fd" font-size="52" font-weight="700">Outputs</text>

    <rect x="1540" y="1940" width="280" height="72" rx="16" fill="#1e3a5f" opacity="0.6"/>
    <text x="1680" y="1986" text-anchor="middle" fill="#93c5fd" font-size="36">Logs</text>

    <rect x="1860" y="1940" width="320" height="72" rx="16" fill="#134e4a" opacity="0.6"/>
    <text x="2020" y="1986" text-anchor="middle" fill="#5eead4" font-size="36">Checkpoint</text>

    <rect x="2220" y="1940" width="280" height="72" rx="16" fill="#78350f" opacity="0.6"/>
    <text x="2360" y="1986" text-anchor="middle" fill="#fcd34d" font-size="36">Events</text>

    <rect x="2540" y="1940" width="280" height="72" rx="16" fill="#7f1d1d" opacity="0.6"/>
    <text x="2680" y="1986" text-anchor="middle" fill="#fca5a5" font-size="36">Artifacts</text>

    <rect x="2860" y="1940" width="280" height="72" rx="16" fill="#4c1d95" opacity="0.5"/>
    <text x="3000" y="1986" text-anchor="middle" fill="#c4b5fd" font-size="36">Outcome</text>

    <rect x="3180" y="1940" width="240" height="72" rx="16" fill="#065f46" opacity="0.6"/>
    <text x="3300" y="1986" text-anchor="middle" fill="#6ee7b7" font-size="36">SSE</text>
  </g>

  <!-- File system -->
  <g>
    <rect x="1480" y="2120" width="960" height="160" rx="32" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="4"/>
    <text x="1960" y="2218" text-anchor="middle" fill="#94a3b8" font-size="44">Filesystem (logs, checkpoints, artifacts)</text>
  </g>

  <line x1="1960" y1="2040" x2="1960" y2="2112" stroke="#64748b" stroke-width="4" marker-end="url(#arr3)"/>

  <!-- SSE / HTTP clients -->
  <g>
    <rect x="2740" y="2120" width="960" height="160" rx="32" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="4"/>
    <text x="3220" y="2218" text-anchor="middle" fill="#94a3b8" font-size="44">HTTP Clients (SSE stream, REST API)</text>
  </g>

  <line x1="3220" y1="2040" x2="3220" y2="2112" stroke="#64748b" stroke-width="4" marker-end="url(#arr3)"/>
</svg>

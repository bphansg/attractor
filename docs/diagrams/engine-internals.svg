<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="parse-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="graph-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="validate-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="exec-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="handler-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="state-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh2" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="750" rx="16" fill="url(#bg2)"/>

  <text x="480" y="44" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Engine Internals</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Pipeline lifecycle: PARSE &#8594; TRANSFORM &#8594; VALIDATE &#8594; EXECUTE &#8594; FINALIZE</text>

  <!-- Phase 1: PARSE -->
  <g filter="url(#sh2)">
    <rect x="40" y="95" width="250" height="130" rx="12" fill="url(#parse-g)" opacity="0.92"/>
    <text x="165" y="122" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1. PARSE</text>
    <rect x="60" y="136" width="210" height="24" rx="6" fill="rgba(255,255,255,0.12)"/>
    <text x="165" y="153" text-anchor="middle" fill="#e0e7ff" font-size="11">.dot source text</text>
    <text x="80" y="182" fill="#c7d2fe" font-size="11">Lexer &#8594; Tokens</text>
    <text x="80" y="200" fill="#c7d2fe" font-size="11">Parser &#8594; AST nodes</text>
  </g>

  <!-- Arrow Parse -> Graph Build -->
  <line x1="290" y1="160" x2="350" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: GRAPH BUILD -->
  <g filter="url(#sh2)">
    <rect x="355" y="95" width="250" height="130" rx="12" fill="url(#graph-g)" opacity="0.92"/>
    <text x="480" y="122" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2. BUILD GRAPH</text>
    <text x="375" y="148" fill="#bfdbfe" font-size="11">AST &#8594; Graph model</text>
    <text x="375" y="168" fill="#bfdbfe" font-size="11">Flatten subgraphs</text>
    <text x="375" y="188" fill="#bfdbfe" font-size="11">Expand chained edges</text>
    <text x="375" y="208" fill="#bfdbfe" font-size="11">Apply default attributes</text>
  </g>

  <!-- Arrow Graph Build -> Validate -->
  <line x1="605" y1="160" x2="665" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: VALIDATE -->
  <g filter="url(#sh2)">
    <rect x="670" y="95" width="250" height="130" rx="12" fill="url(#validate-g)" opacity="0.92"/>
    <text x="795" y="122" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3. VALIDATE</text>
    <text x="690" y="148" fill="#ccfbf1" font-size="11">13 lint rules:</text>
    <text x="690" y="166" fill="#99f6e4" font-size="10">start_node, terminal_node, reachability,</text>
    <text x="690" y="182" fill="#99f6e4" font-size="10">edge_target_exists, missing_prompt,</text>
    <text x="690" y="198" fill="#99f6e4" font-size="10">fan_in_after_parallel, goal_gate_valid,</text>
    <text x="690" y="214" fill="#99f6e4" font-size="10">condition_syntax, ...</text>
  </g>

  <!-- Arrow down from Validate to Execute -->
  <path d="M 795 225 L 795 265 L 480 265 L 480 290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Phase 4: TRANSFORM (small) -->
  <g filter="url(#sh2)">
    <rect x="620" y="260" width="230" height="55" rx="10" fill="rgba(99,102,241,0.25)" stroke="#6366f1" stroke-width="1"/>
    <text x="735" y="283" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">TRANSFORM</text>
    <text x="735" y="302" text-anchor="middle" fill="#818cf8" font-size="10">$goal expansion | stylesheet | custom</text>
  </g>

  <!-- Phase 5: EXECUTE -->
  <g filter="url(#sh2)">
    <rect x="100" y="300" width="760" height="240" rx="12" fill="url(#exec-g)" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="480" y="330" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">4. EXECUTE (Runner Loop)</text>

    <!-- Current node -->
    <rect x="130" y="350" width="160" height="55" rx="8" fill="url(#exec-g)" opacity="0.9"/>
    <text x="210" y="375" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Pick Current Node</text>
    <text x="210" y="393" text-anchor="middle" fill="#fef3c7" font-size="10">from start or edge</text>

    <!-- Handler dispatch -->
    <line x1="290" y1="377" x2="330" y2="377" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="335" y="350" width="160" height="55" rx="8" fill="url(#handler-g)" opacity="0.9"/>
    <text x="415" y="375" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Dispatch Handler</text>
    <text x="415" y="393" text-anchor="middle" fill="#fee2e2" font-size="10">by node type/shape</text>

    <!-- Outcome -->
    <line x1="495" y1="377" x2="535" y2="377" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="540" y="350" width="140" height="55" rx="8" fill="url(#state-g)" opacity="0.9"/>
    <text x="610" y="375" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Get Outcome</text>
    <text x="610" y="393" text-anchor="middle" fill="#ede9fe" font-size="10">success | fail | retry</text>

    <!-- Edge selection -->
    <line x1="680" y1="377" x2="720" y2="377" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="720" y="350" width="120" height="55" rx="8" fill="rgba(255,255,255,0.1)" stroke="#fbbf24" stroke-width="1"/>
    <text x="780" y="375" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="600">Edge Select</text>
    <text x="780" y="393" text-anchor="middle" fill="#fde68a" font-size="10">5-step priority</text>

    <!-- Loop back arrow -->
    <path d="M 780 405 L 780 430 Q 780 445 765 445 L 225 445 Q 210 445 210 430 L 210 410" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="480" y="462" text-anchor="middle" fill="#fde68a" font-size="10" font-style="italic">loop until exit node reached</text>

    <!-- Retry/failure routing -->
    <text x="415" y="500" text-anchor="middle" fill="#fca5a5" font-size="10">on fail: retry &#8594; fail_edge &#8594; retry_target &#8594; fallback &#8594; terminate</text>
    <text x="415" y="518" text-anchor="middle" fill="#86efac" font-size="10">goal gates checked before exit</text>
  </g>

  <!-- Node Handlers grid -->
  <text x="480" y="570" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Node Handlers (9 types)</text>

  <g>
    <rect x="40" y="588" width="95" height="44" rx="8" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1"/>
    <text x="87" y="607" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Start</text>
    <text x="87" y="622" text-anchor="middle" fill="#818cf8" font-size="9">Mdiamond</text>
  </g>
  <g>
    <rect x="145" y="588" width="95" height="44" rx="8" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1"/>
    <text x="192" y="607" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Exit</text>
    <text x="192" y="622" text-anchor="middle" fill="#818cf8" font-size="9">Msquare</text>
  </g>
  <g>
    <rect x="250" y="588" width="95" height="44" rx="8" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
    <text x="297" y="607" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Codergen</text>
    <text x="297" y="622" text-anchor="middle" fill="#60a5fa" font-size="9">box (LLM)</text>
  </g>
  <g>
    <rect x="355" y="588" width="95" height="44" rx="8" fill="rgba(20,184,166,0.2)" stroke="#14b8a6" stroke-width="1"/>
    <text x="402" y="607" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="600">Conditional</text>
    <text x="402" y="622" text-anchor="middle" fill="#2dd4bf" font-size="9">diamond</text>
  </g>
  <g>
    <rect x="460" y="588" width="95" height="44" rx="8" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="507" y="607" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Human Gate</text>
    <text x="507" y="622" text-anchor="middle" fill="#fbbf24" font-size="9">hexagon</text>
  </g>
  <g>
    <rect x="565" y="588" width="95" height="44" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="612" y="607" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Parallel</text>
    <text x="612" y="622" text-anchor="middle" fill="#f87171" font-size="9">component</text>
  </g>
  <g>
    <rect x="670" y="588" width="95" height="44" rx="8" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="717" y="607" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Fan-In</text>
    <text x="717" y="622" text-anchor="middle" fill="#a78bfa" font-size="9">tripleoctagon</text>
  </g>
  <g>
    <rect x="775" y="588" width="75" height="44" rx="8" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1"/>
    <text x="812" y="607" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="600">Tool</text>
    <text x="812" y="622" text-anchor="middle" fill="#f472b6" font-size="9">parallelogram</text>
  </g>
  <g>
    <rect x="860" y="588" width="75" height="44" rx="8" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="1"/>
    <text x="897" y="607" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="600">Manager</text>
    <text x="897" y="622" text-anchor="middle" fill="#22d3ee" font-size="9">house</text>
  </g>

  <!-- State management bar -->
  <g filter="url(#sh2)">
    <rect x="100" y="655" width="760" height="70" rx="12" fill="url(#state-g)" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="480" y="682" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">State Layer</text>
    <text x="200" y="708" text-anchor="middle" fill="#a78bfa" font-size="11">Context (KV store)</text>
    <text x="380" y="708" text-anchor="middle" fill="#a78bfa" font-size="11">Outcomes</text>
    <text x="520" y="708" text-anchor="middle" fill="#a78bfa" font-size="11">Checkpoints</text>
    <text x="670" y="708" text-anchor="middle" fill="#a78bfa" font-size="11">Artifacts</text>
    <text x="800" y="708" text-anchor="middle" fill="#a78bfa" font-size="11">Events</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 3000" width="3840" height="3000" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="parse-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="graph-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="validate-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="exec-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="handler-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="state-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="3840" height="3000" rx="48" fill="url(#bg2)"/>

  <text x="1920" y="170" text-anchor="middle" fill="#f1f5f9" font-size="88" font-weight="700">Engine Internals</text>
  <text x="1920" y="270" text-anchor="middle" fill="#94a3b8" font-size="52">Pipeline lifecycle: PARSE &#8594; TRANSFORM &#8594; VALIDATE &#8594; EXECUTE &#8594; FINALIZE</text>

  <!-- Phase 1: PARSE -->
  <g>
    <rect x="120" y="370" width="1060" height="520" rx="48" fill="url(#parse-g)" opacity="0.92"/>
    <text x="650" y="480" text-anchor="middle" fill="#fff" font-size="64" font-weight="700">1. PARSE</text>
    <rect x="200" y="530" width="900" height="96" rx="24" fill="#4338ca" opacity="0.4"/>
    <text x="650" y="593" text-anchor="middle" fill="#e0e7ff" font-size="44">.dot source text</text>
    <text x="280" y="720" fill="#c7d2fe" font-size="44">Lexer &#8594; Tokens</text>
    <text x="280" y="800" fill="#c7d2fe" font-size="44">Parser &#8594; AST nodes</text>
  </g>

  <!-- Arrow Parse -> Graph Build -->
  <line x1="1180" y1="630" x2="1340" y2="630" stroke="#64748b" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Phase 2: GRAPH BUILD -->
  <g>
    <rect x="1380" y="370" width="1060" height="520" rx="48" fill="url(#graph-g)" opacity="0.92"/>
    <text x="1910" y="480" text-anchor="middle" fill="#fff" font-size="64" font-weight="700">2. BUILD GRAPH</text>
    <text x="1480" y="580" fill="#bfdbfe" font-size="44">AST &#8594; Graph model</text>
    <text x="1480" y="660" fill="#bfdbfe" font-size="44">Flatten subgraphs</text>
    <text x="1480" y="740" fill="#bfdbfe" font-size="44">Expand chained edges</text>
    <text x="1480" y="820" fill="#bfdbfe" font-size="44">Apply default attributes</text>
  </g>

  <!-- Arrow Graph Build -> Validate -->
  <line x1="2440" y1="630" x2="2600" y2="630" stroke="#64748b" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- Phase 3: VALIDATE -->
  <g>
    <rect x="2640" y="370" width="1060" height="520" rx="48" fill="url(#validate-g)" opacity="0.92"/>
    <text x="3170" y="480" text-anchor="middle" fill="#fff" font-size="64" font-weight="700">3. VALIDATE</text>
    <text x="2740" y="580" fill="#ccfbf1" font-size="44">13 lint rules:</text>
    <text x="2740" y="656" fill="#99f6e4" font-size="40">start_node, terminal_node, reachability,</text>
    <text x="2740" y="720" fill="#99f6e4" font-size="40">edge_target_exists, missing_prompt,</text>
    <text x="2740" y="784" fill="#99f6e4" font-size="40">fan_in_after_parallel, goal_gate_valid,</text>
    <text x="2740" y="848" fill="#99f6e4" font-size="40">condition_syntax, ...</text>
  </g>

  <!-- Arrow down from Validate to Execute -->
  <path d="M 3170 890 L 3170 1020 L 1920 1020 L 1920 1100" stroke="#64748b" stroke-width="8" fill="none" marker-end="url(#arrow)"/>

  <!-- Phase 4: TRANSFORM -->
  <g>
    <rect x="2480" y="1000" width="920" height="220" rx="40" fill="#4338ca" opacity="0.25" stroke="#6366f1" stroke-width="4"/>
    <text x="2940" y="1100" text-anchor="middle" fill="#a5b4fc" font-size="48" font-weight="600">TRANSFORM</text>
    <text x="2940" y="1175" text-anchor="middle" fill="#818cf8" font-size="40">$goal expansion | stylesheet | custom</text>
  </g>

  <!-- Phase 5: EXECUTE -->
  <g>
    <rect x="360" y="1180" width="3120" height="960" rx="48" fill="#78350f" opacity="0.15" stroke="#f59e0b" stroke-width="4"/>
    <text x="1920" y="1300" text-anchor="middle" fill="#fbbf24" font-size="64" font-weight="700">4. EXECUTE (Runner Loop)</text>

    <!-- Current node -->
    <rect x="480" y="1380" width="640" height="220" rx="32" fill="url(#exec-g)" opacity="0.9"/>
    <text x="800" y="1480" text-anchor="middle" fill="#fff" font-size="48" font-weight="600">Pick Current Node</text>
    <text x="800" y="1550" text-anchor="middle" fill="#fef3c7" font-size="40">from start or edge</text>

    <!-- Handler dispatch -->
    <line x1="1120" y1="1490" x2="1280" y2="1490" stroke="#fbbf24" stroke-width="8" marker-end="url(#arrow)"/>
    <rect x="1300" y="1380" width="640" height="220" rx="32" fill="url(#handler-g)" opacity="0.9"/>
    <text x="1620" y="1480" text-anchor="middle" fill="#fff" font-size="48" font-weight="600">Dispatch Handler</text>
    <text x="1620" y="1550" text-anchor="middle" fill="#fee2e2" font-size="40">by node type/shape</text>

    <!-- Outcome -->
    <line x1="1940" y1="1490" x2="2100" y2="1490" stroke="#fbbf24" stroke-width="8" marker-end="url(#arrow)"/>
    <rect x="2120" y="1380" width="560" height="220" rx="32" fill="url(#state-g)" opacity="0.9"/>
    <text x="2400" y="1480" text-anchor="middle" fill="#fff" font-size="48" font-weight="600">Get Outcome</text>
    <text x="2400" y="1550" text-anchor="middle" fill="#ede9fe" font-size="40">success | fail | retry</text>

    <!-- Edge selection -->
    <line x1="2680" y1="1490" x2="2840" y2="1490" stroke="#fbbf24" stroke-width="8" marker-end="url(#arrow)"/>
    <rect x="2860" y="1380" width="480" height="220" rx="32" fill="#334155" stroke="#fbbf24" stroke-width="4"/>
    <text x="3100" y="1480" text-anchor="middle" fill="#fef3c7" font-size="48" font-weight="600">Edge Select</text>
    <text x="3100" y="1550" text-anchor="middle" fill="#fde68a" font-size="40">5-step priority</text>

    <!-- Loop back arrow -->
    <path d="M 3100 1600 L 3100 1720 Q 3100 1780 3040 1780 L 860 1780 Q 800 1780 800 1720 L 800 1610" stroke="#fbbf24" stroke-width="6" fill="none" stroke-dasharray="20,12" marker-end="url(#arrow)"/>
    <text x="1920" y="1840" text-anchor="middle" fill="#fde68a" font-size="40" font-style="italic">loop until exit node reached</text>

    <!-- Retry/failure routing -->
    <text x="1620" y="1960" text-anchor="middle" fill="#fca5a5" font-size="40">on fail: retry &#8594; fail_edge &#8594; retry_target &#8594; fallback &#8594; terminate</text>
    <text x="1620" y="2040" text-anchor="middle" fill="#86efac" font-size="40">goal gates checked before exit</text>
  </g>

  <!-- Node Handlers grid -->
  <text x="1920" y="2260" text-anchor="middle" fill="#f1f5f9" font-size="60" font-weight="700">Node Handlers (9 types)</text>

  <g>
    <rect x="100" y="2320" width="380" height="180" rx="32" fill="#312e81" opacity="0.4" stroke="#6366f1" stroke-width="4"/>
    <text x="290" y="2400" text-anchor="middle" fill="#a5b4fc" font-size="40" font-weight="600">Start</text>
    <text x="290" y="2460" text-anchor="middle" fill="#818cf8" font-size="36">Mdiamond</text>
  </g>
  <g>
    <rect x="520" y="2320" width="380" height="180" rx="32" fill="#312e81" opacity="0.4" stroke="#6366f1" stroke-width="4"/>
    <text x="710" y="2400" text-anchor="middle" fill="#a5b4fc" font-size="40" font-weight="600">Exit</text>
    <text x="710" y="2460" text-anchor="middle" fill="#818cf8" font-size="36">Msquare</text>
  </g>
  <g>
    <rect x="940" y="2320" width="380" height="180" rx="32" fill="#1e3a5f" opacity="0.4" stroke="#3b82f6" stroke-width="4"/>
    <text x="1130" y="2400" text-anchor="middle" fill="#93c5fd" font-size="40" font-weight="600">Codergen</text>
    <text x="1130" y="2460" text-anchor="middle" fill="#60a5fa" font-size="36">box (LLM)</text>
  </g>
  <g>
    <rect x="1360" y="2320" width="380" height="180" rx="32" fill="#134e4a" opacity="0.4" stroke="#14b8a6" stroke-width="4"/>
    <text x="1550" y="2400" text-anchor="middle" fill="#5eead4" font-size="40" font-weight="600">Conditional</text>
    <text x="1550" y="2460" text-anchor="middle" fill="#2dd4bf" font-size="36">diamond</text>
  </g>
  <g>
    <rect x="1780" y="2320" width="400" height="180" rx="32" fill="#78350f" opacity="0.4" stroke="#f59e0b" stroke-width="4"/>
    <text x="1980" y="2400" text-anchor="middle" fill="#fcd34d" font-size="40" font-weight="600">Human Gate</text>
    <text x="1980" y="2460" text-anchor="middle" fill="#fbbf24" font-size="36">hexagon</text>
  </g>
  <g>
    <rect x="2220" y="2320" width="380" height="180" rx="32" fill="#7f1d1d" opacity="0.4" stroke="#ef4444" stroke-width="4"/>
    <text x="2410" y="2400" text-anchor="middle" fill="#fca5a5" font-size="40" font-weight="600">Parallel</text>
    <text x="2410" y="2460" text-anchor="middle" fill="#f87171" font-size="36">component</text>
  </g>
  <g>
    <rect x="2640" y="2320" width="380" height="180" rx="32" fill="#4c1d95" opacity="0.4" stroke="#8b5cf6" stroke-width="4"/>
    <text x="2830" y="2400" text-anchor="middle" fill="#c4b5fd" font-size="40" font-weight="600">Fan-In</text>
    <text x="2830" y="2460" text-anchor="middle" fill="#a78bfa" font-size="36">tripleoctagon</text>
  </g>
  <g>
    <rect x="3060" y="2320" width="340" height="180" rx="32" fill="#831843" opacity="0.4" stroke="#ec4899" stroke-width="4"/>
    <text x="3230" y="2400" text-anchor="middle" fill="#f9a8d4" font-size="40" font-weight="600">Tool</text>
    <text x="3230" y="2460" text-anchor="middle" fill="#f472b6" font-size="36">parallelogram</text>
  </g>
  <g>
    <rect x="3440" y="2320" width="340" height="180" rx="32" fill="#164e63" opacity="0.4" stroke="#22d3ee" stroke-width="4"/>
    <text x="3610" y="2400" text-anchor="middle" fill="#67e8f9" font-size="40" font-weight="600">Manager</text>
    <text x="3610" y="2460" text-anchor="middle" fill="#22d3ee" font-size="36">house</text>
  </g>

  <!-- State management bar -->
  <g>
    <rect x="360" y="2600" width="3120" height="280" rx="48" fill="#4c1d95" opacity="0.2" stroke="#8b5cf6" stroke-width="4"/>
    <text x="1920" y="2710" text-anchor="middle" fill="#c4b5fd" font-size="52" font-weight="600">State Layer</text>
    <text x="760" y="2800" text-anchor="middle" fill="#a78bfa" font-size="44">Context (KV store)</text>
    <text x="1480" y="2800" text-anchor="middle" fill="#a78bfa" font-size="44">Outcomes</text>
    <text x="2040" y="2800" text-anchor="middle" fill="#a78bfa" font-size="44">Checkpoints</text>
    <text x="2640" y="2800" text-anchor="middle" fill="#a78bfa" font-size="44">Artifacts</text>
    <text x="3160" y="2800" text-anchor="middle" fill="#a78bfa" font-size="44">Events</text>
  </g>
</svg>
